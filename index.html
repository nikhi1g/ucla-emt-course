<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UCLA EMT Course</title>
    <style>
      :root {
        color: #152033;
        background: #f5f7fb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100% - 32px));
        border: 1px solid #d7deea;
        border-radius: 24px;
        padding: clamp(32px, 8vw, 72px);
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(21, 32, 51, 0.12);
      }

      p {
        color: #5b667a;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 7rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello world.</h1>
      <p>GitHub Pages is deploying a clean static site from this repository.</p>
    </main>
  </body>
</html>
